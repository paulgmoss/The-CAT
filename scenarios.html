<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scenarios · The CAT</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mulish:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">

  <style>/* ACT Design Tokens — University palette, restrained light use */
:root {
  --c-white: #FFFFFF;
  --c-bg: #F8EFE0;
  --c-bg-2: #EDEAE0;
  --c-bg-3: #E6E2D4;
  --c-ink: #140F50;
  --c-ink-2: #2A2560;
  --c-body: #3E3A6B;
  --c-muted: #6B6790;
  --c-hairline: #E5DFC9;
  --c-hairline-2: #D9D2B8;
  --c-bright: #5B3DF5;
  --c-purple: #836BFF;
  --c-red: #D31569;
  --c-red-2: #EF3E8C;
  --c-bright-soft: rgba(91, 61, 245, 0.08);
  --c-purple-soft: rgba(131, 107, 255, 0.12);

  --f-display: Georgia, "Times New Roman", "Times", serif;
  --f-sans: "Mulish", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, monospace;

  --fs-xs: 12px; --fs-sm: 13px; --fs-base: 15px; --fs-md: 17px; --fs-lg: 20px; --fs-xl: 28px; --fs-2xl: 40px; --fs-3xl: 56px; --fs-4xl: 84px; --fs-5xl: 128px;
  --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 24px; --sp-6: 32px; --sp-7: 48px; --sp-8: 64px; --sp-9: 96px; --sp-10: 128px;
  --radius-sm: 4px; --radius: 8px; --radius-lg: 14px;
  --maxw: 1280px; --gutter: 48px;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--f-sans);
  font-size: var(--fs-base);
  line-height: 1.55;
  color: var(--c-body);
  background: var(--c-bg);
  font-feature-settings: "ss01", "cv11";
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
a { color: var(--c-bright); text-decoration: none; }
a:hover { color: var(--c-ink); }
button { font-family: inherit; }
h1, h2, h3, h4 { font-family: var(--f-display); color: var(--c-ink); font-weight: 400; letter-spacing: -0.01em; line-height: 1.05; margin: 0; }
.mono { font-family: var(--f-mono); font-feature-settings: "ss01"; }
.eyebrow { font-family: var(--f-mono); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--c-muted); font-weight: 500; }
.container { max-width: var(--maxw); margin: 0 auto; padding: 0 var(--gutter); }
.hairline { height: 1px; background: var(--c-hairline); border: 0; margin: 0; }
.btn { display: inline-flex; align-items: center; gap: 8px; padding: 12px 20px; border-radius: 999px; font-family: var(--f-sans); font-size: 14px; font-weight: 500; letter-spacing: -0.005em; border: 1px solid transparent; cursor: pointer; transition: transform 180ms ease, background 180ms ease, color 180ms ease, border-color 180ms ease; text-decoration: none; white-space: nowrap; }
.btn-primary { background: var(--c-ink); color: var(--c-bg-2); border-color: var(--c-ink); }
.btn-primary:hover { transform: translateY(-1px); background: #0a0640; }
.site-cta { display: flex; gap: 6px; flex-shrink: 0; }
.btn-nav-a { font-size: 13px; padding: 10px 14px; background: var(--c-red); border-color: var(--c-red); color: #fff; }
.btn-nav-a:hover { background: #A80F52; border-color: #A80F52; transform: translateY(-1px); }
.btn-nav-b { font-size: 13px; padding: 10px 14px; background: var(--c-red-2); border-color: var(--c-red-2); color: #fff; }
.btn-nav-b:hover { background: var(--c-red); border-color: var(--c-red); transform: translateY(-1px); }
:focus-visible { outline: 2px solid var(--c-bright); outline-offset: 2px; }
html { scroll-behavior: smooth; }
</style>
  <style>/* ACT — Shell styles (nav, footer) */
.site-nav { position: sticky; top: 0; z-index: 50; background: rgba(244, 242, 234, 0.72); backdrop-filter: saturate(1.4) blur(14px); -webkit-backdrop-filter: saturate(1.4) blur(14px); transition: border-color 240ms ease, background 240ms ease; border-bottom: 1px solid transparent; }
.site-nav.is-scrolled { background: rgba(244, 242, 234, 0.92); border-bottom-color: var(--c-hairline); }
.site-nav-inner { display: flex; align-items: center; gap: 32px; padding: 14px var(--gutter); }
.site-brand { display: flex; align-items: center; gap: 10px; color: var(--c-ink); flex-shrink: 0; }
.brand-mark { display: flex; padding: 4px; border-radius: 8px; }
.brand-text { display: flex; flex-direction: column; line-height: 1; }
.brand-name { font-family: var(--f-display); font-size: 22px; color: var(--c-ink); letter-spacing: 0.01em; }
.brand-sub { font-family: var(--f-mono); font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--c-muted); margin-top: 2px; }
.site-links { display: flex; gap: 2px; margin-left: auto; margin-right: 12px; }
.site-link { padding: 8px 14px; font-size: 14px; color: var(--c-body); border-radius: 6px; transition: color 160ms, background 160ms; letter-spacing: -0.005em; white-space: nowrap; }
.site-link:hover { color: var(--c-ink); background: rgba(20,15,80,0.04); }
.site-link.is-current { color: var(--c-ink); }
.site-link.is-current::after { content: ''; display: block; height: 1px; background: var(--c-ink); margin: 2px 2px 0; }
.site-footer { margin-top: var(--sp-6); padding: 20px 0; background: var(--c-bg-2); border-top: 1px solid var(--c-hairline); }
.footer-row { display: flex; align-items: center; justify-content: space-between; gap: 24px; flex-wrap: wrap; }
.footer-brand { display: flex; align-items: center; gap: 14px; }
.footer-brand .footer-mark { margin-bottom: 0; }
.footer-brand-text { display: flex; flex-direction: column; gap: 2px; }
.footer-title { font-family: var(--f-display); font-size: 15px; color: var(--c-ink); line-height: 1.2; }
.footer-note { font-size: 12px; color: var(--c-muted); line-height: 1.3; max-width: none; }
.footer-bottom { padding-top: 0; border-top: 0; display: flex; gap: 20px; color: var(--c-muted); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; }
.btn .arrow { transition: transform 240ms ease; }
.btn:hover .arrow { transform: translateX(3px); }
@media (max-width: 1200px) { .site-links { gap: 0; } .site-link { padding: 8px 10px; font-size: 13px; } .brand-sub { display: none; } }
@media (max-width: 1180px) { .site-links { display: none; } }
@media (max-width: 900px) { .footer-grid { grid-template-columns: 1fr 1fr; } :root { --gutter: 24px; } }
@media (max-width: 620px) { .site-cta { display: none; } }
</style>
  <!-- Scenarios content design-system tokens (--cat-*, --font-*, --text-*, --space-*, --radius-*, --shadow-*) -->
  <link rel="stylesheet" href="scenarios-tokens-final.css">
  <style>
    .scenario-toggle:hover { background: rgba(20,15,80,0.02); }
    .cat-letter { color: var(--c-purple); font-style: normal; }

</head>

  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
